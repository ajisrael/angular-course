<div class="top-menu">

  <img class="logo" src="https://angular-academy.s3.amazonaws.com/main-logo/main-page-logo-small-hat.png">

</div>

<div>
  <div class="courses">

    <!-- semicolons are required for *ngFor js code -->
    @for (course of courses; track course; let i = $index;) {
    <course-card [class.is-first]="isFirst" [class.is-last]="isLast" [class.is-even]="isEven" [class.is-odd]="isOdd"
      (courseSelected)="onCourseSelected($event)" [course]="course" [cardIndex]="i + 1"></course-card>
    }

  </div>
</div>
